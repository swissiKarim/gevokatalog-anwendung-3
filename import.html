<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeVo‑Katalog Import</title>
  <style>
    body {
      background: #f8f9fa;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .container {
      width: 600px;
      margin: 40px auto 0 auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 28px #aaa4  ;
      padding: 32px;
    }
    h1 {
      text-align: center;
      font-size: 2.2rem;
      font-weight: 600;
      color: #222;
      margin-bottom: 12px;
    }
    .subtitle {
      text-align: center;
      color: #555;
      font-size: 1rem;
      margin-bottom: 34px;
    }
    .dropzone {
      border: 2px dashed #ccc;
      background: #fff;
      border-radius: 7px;
      text-align: center;
      padding: 30px 0;
      color: #555;
      font-size: 1.08rem;
      margin-bottom: 6px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .dropzone.dragover {
      border-color: #8792F6;
    }
    .error-msg-drop {
      color: #d33;
      text-align: center;
      font-size: 0.94rem;
      min-height: 18px;
      margin-bottom: 10px;
    }
    label {
      font-weight: 500;
      color: #222;
      display: block;
      margin-bottom: 7px;
      margin-top: 18px;
      font-size: 1rem;
    }
    input[type="text"], textarea {
      width: 100%;
      font-size: 1.07rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 10px;
      background: #fbfbfb;
      margin-bottom: 8px;
      color: #222;
    }
    .checkbox-row {
      margin-top: 18px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 13px;
    }
    .checkbox-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #565656;
    }
    .import-btn {
      background: #8a8a8a;
      color: #fff;
      font-size: 1.18rem;
      border: none;
      width: 100%;
      height: 44px;
      border-radius: 7px;
      cursor: pointer;
      margin: 18px 0 4px 0;
      font-weight: 500;
      transition: background 0.2s;
    }
    .import-btn:hover, .import-btn:active {
      background: #333;
    }
    .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid #eee;
      border-radius: 50%;
      border-top: 3px solid #888;
      animation: spin 1s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .status-msg {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 12px 0 0 0;
      min-height: 21px;
      font-size: 1.04rem;
      gap: 10px;
    }
    .status-success { color: #22aa55; }
    .status-error { color: #d33; }
    .status-neutral { color: #555; }
  </style>
</head>
<body>
  <div class="container">
    <h1>GeVo‑Katalog Import</h1>
    <div class="subtitle">Excel-Datei (.xlsx) hochladen und in die GMS‑Datenbank (Schema gms) importieren.</div>
    <div id="file-dropzone" class="dropzone" tabindex="0">
      Klicken oder Datei hierher ziehen (.xlsx)
      <input id="file-input" type="file" accept=".xlsx" style="display: none" />
    </div>
    <div id="drop-error" class="error-msg-drop"></div>

    <form id="import-form" autocomplete="off">
      <label for="fachbereich">Fachbereich</label>
      <input id="fachbereich" name="fachbereich" type="text" value="Import" />
      <label for="beschreibung">Fachliche Beschreibung</label>
      <input id="beschreibung" name="beschreibung" type="text" value="Excel-Import" />
      <label for="version">Version</label>
      <input id="version" name="version" type="text" value="1.0" />
      <div class="checkbox-row">
        <input id="db-own" name="db-own" type="checkbox" />
        <label for="db-own" style="margin: 0; font-weight: 400; color: #222">Eigene DB-Verbindung (ansonsten Konfiguration aus Umgebung)</label>
      </div>
      <button id="import-btn" class="import-btn" type="submit">Import starten</button>
      <div id="status-spinner" class="status-msg status-neutral" style="display:none;"><span class="spinner"></span> Import läuft …</div>
      <div id="status-error" class="status-msg status-error" style="display:none;"></div>
      <div id="status-success" class="status-msg status-success" style="display:none;"></div>
    </form>
  </div>
  <script>
    const dropzone = document.getElementById('file-dropzone');
    const fileInput = document.getElementById('file-input');
    const dropError = document.getElementById('drop-error');
    let selectedFile = null;

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') fileInput.click();
    });
    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      fileInput.files = e.dataTransfer.files;
      handleFile(file);
    });
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      handleFile(file);
    });
    function handleFile(file) {
      if (!file || !file.name.endsWith('.xlsx')) {
        dropError.textContent = 'Bitte eine gültige .xlsx-Datei auswählen.';
        selectedFile = null;
      } else {
        dropError.textContent = '';
        selectedFile = file;
      }
    }

    // Status Elements
    const importForm = document.getElementById('import-form');
    const statusSpinner = document.getElementById('status-spinner');
    const statusError = document.getElementById('status-error');
    const statusSuccess = document.getElementById('status-success');
    importForm.addEventListener('submit', (e) => {
      e.preventDefault();
      statusSpinner.style.display = 'none';
      statusError.style.display = 'none';
      statusSuccess.style.display = 'none';

      if (!selectedFile) {
        dropError.textContent = 'Bitte eine gültige .xlsx-Datei auswählen.';
        return;
      }
      const fachbereich = document.getElementById('fachbereich').value.trim();
      const beschreibung = document.getElementById('beschreibung').value.trim();
      const version = document.getElementById('version').value.trim();
      if (!fachbereich || !beschreibung || !version) {
        statusError.style.display = "block";
        statusError.textContent = "Fehler: Pflichtfelder fehlen oder Datei ungültig.";
        return;
      }
      // Simulate Import...
      statusSpinner.style.display = 'flex';
      setTimeout(() => {
        statusSpinner.style.display = 'none';
        statusSuccess.style.display = 'block';
        statusSuccess.textContent = "Import erfolgreich abgeschlossen.";
      }, 1500);
    });
  </script>
</body>
</html>
